apiVersion: batch/v1
kind: Job
metadata:
  name: model-training
  namespace: ml-training
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: mlops-train:v1
        imagePullPolicy: IfNotPresent
        env:
        - name: TRAINING_CONFIG
          value: /app/configs/training_config.yaml
        resources:
          requests: {cpu: "2", memory: 4Gi}
          limits: {cpu: "2", memory: 4Gi}
        volumeMounts:
        - {name: config, mountPath: /app/configs}
        - {name: data, mountPath: /app/data}
        - {name: checkpoints, mountPath: /app/checkpoints}
      volumes:
      - name: config
        configMap: {name: training-config}
      - name: data
        persistentVolumeClaim: {claimName: dataset-pvc}
      - name: checkpoints
        persistentVolumeClaim: {claimName: checkpoint-pvc}
